# Dois devices: um com desfoque, um de passagem. Trocar entre eles no seletor de
# camera do Meet/Slack/Teams liga e desliga o blur, sem terminal.
#
# max_buffers=8 nao e opcional: o padrao 2 faz o Chrome recusar a camera com
# "camera indisponivel" — ele pede 4 no REQBUFS, aceita 2, mapeia, e passa fome
# no DQBUF. Ver docs/TROUBLESHOOTING.md.
#
# card_label leva UMA string com virgulas dentro. Escrever
# card_label="NPU Blur Cam","NPU Cam" coloca aspas literais nos rotulos.
options v4l2loopback devices=2 video_nr=9,10 card_label="NPU Blur Cam,NPU Cam" exclusive_caps=1,1 max_buffers=8
