# max_buffers=8 nao e opcional: o padrao 2 faz o Chrome falhar com
# "camera indisponivel" — ele pede 4 buffers no REQBUFS, aceita os 2,
# mapeia, e depois passa fome no DQBUF. Ver docs/TROUBLESHOOTING.md.
options v4l2loopback devices=1 video_nr=9 card_label="NPU Blur Cam" exclusive_caps=1 max_buffers=8
